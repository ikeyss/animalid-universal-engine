services:
  - type: web
    name: animalid-universal-engine
    runtime: python
    plan: free
    rootDir: Backend_AnimalID_HF
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
